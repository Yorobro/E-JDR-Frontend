name: CI

on: [push, pull_request]

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # `verify` regroupe detekt + build/tests + couverture (cf. build.gradle.kts).
      # Identique à `./gradlew verify` en local : la CI et le poste de dev ne peuvent plus diverger.
      - name: Verify (detekt + build + tests + coverage)
        run: ./gradlew verify --no-daemon --stacktrace
