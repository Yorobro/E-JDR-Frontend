name: Release - release tooling checks

on:
  pull_request:
    branches: [main]

jobs:
  lint_commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Install dev deps
        run: npm install
      - name: Validate commit messages
        # Seuls les commits propres à la PR : HEAD~10 sur le merge commit remontait l'historique de main.
        run: npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
