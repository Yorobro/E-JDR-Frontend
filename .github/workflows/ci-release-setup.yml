name: Release - release tooling checks

on:
  pull_request:
    branches: [main]

jobs:
  lint_commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dev deps
        run: npm ci
      # Ne valider QUE les commits de la PR. `--from=HEAD~10` remontait à l'aveugle 10 commits en
      # arrière : il relisait des commits déjà mergés dans main et faisait échouer la PR pour des
      # messages qu'on ne peut plus corriger (et laissait passer une PR de plus de 10 commits).
      # Aligné sur le workflow du backend.
      - name: Validate PR commits
        run: >-
          npx commitlint
          --from "${{ github.event.pull_request.base.sha }}"
          --to "${{ github.event.pull_request.head.sha }}"
          --verbose
