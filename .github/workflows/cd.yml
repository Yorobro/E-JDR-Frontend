name: CD - Build & Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows_build:
    name: Build native Windows distribution
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew is executable
        run: echo "gradlew available"

      - name: Install packaging tools
        shell: pwsh
        run: |
          choco install -y innosetup || echo 'InnoSetup install failed or already present'
          choco install -y wixtoolset || echo 'WiX install failed or already present'

      - name: Build native Windows distribution
        run: .\gradlew.bat packageDistributionForCurrentOS --no-daemon --stacktrace

      - name: Upload built distributions
        uses: actions/upload-artifact@v4
        with:
          name: ejdr-dist
          path: |
            build/compose/**
            build/**/*.exe
            build/**/*.msi
            build/distributions/**

  publish_release:
    name: Create Release and upload assets
    needs: windows_build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: ejdr-dist
          path: dist

      - name: Show downloaded files
        run: ls -R dist || true

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: E-JDR v${{ github.run_number }}
          body: Automated build from ${{ github.event.workflow_run.head_sha }}
          files: |
            dist/**/*.exe
            dist/**/*.msi
            dist/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
