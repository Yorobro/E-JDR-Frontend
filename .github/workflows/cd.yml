name: CD

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows_build:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build EXE and MSI
        run: .\gradlew.bat packageDistributionForCurrentOS --no-daemon --stacktrace

      - name: Upload ONLY app artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: |
            build/compose/binaries/**/exe/*.exe
            build/compose/binaries/**/msi/*.msi

  release:
    name: Attach artifacts to GitHub Release
    needs: windows_build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: app-build
          path: dist

      - name: Show files (debug)
        run: ls -R dist || true

      - name: Upload assets to the published release
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const dist = path.join(process.cwd(), 'dist');
            if (!fs.existsSync(dist)) {
              core.info('No dist directory found, nothing to upload.');
              return;
            }
            function walk(dir) {
              let results = [];
              for (const f of fs.readdirSync(dir)) {
                const p = path.join(dir, f);
                const stat = fs.statSync(p);
                if (stat.isDirectory()) results = results.concat(walk(p));
                else results.push(p);
              }
              return results;
            }
            const files = walk(dist).filter(f => /\.(exe|msi|zip|tar|gz)$/.test(f));
            if (files.length === 0) {
              core.info('No release assets found to upload.');
              return;
            }
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = github.event.release && github.event.release.tag_name ? github.event.release.tag_name : context.ref.replace('refs/tags/', '');
            core.info(`Uploading ${files.length} asset(s) to release ${tag}`);
            const release = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            const release_id = release.data.id;
            for (const filePath of files) {
              const name = path.basename(filePath);
              const data = fs.readFileSync(filePath);
              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id,
                name,
                data,
                headers: {
                  'content-type': 'application/octet-stream',
                  'content-length': fs.statSync(filePath).size
                }
              });
              core.info(`Uploaded ${name}`);
            }