name: CD - Build & Release

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows_build:
    name: Build Windows EXE
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build EXE and MSI
        run: .\gradlew.bat packageDistributionForCurrentOS --no-daemon --stacktrace

      - name: Upload ONLY app artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: |
            build/compose/binaries/main/exe/*.exe
            build/compose/binaries/main/msi/*.msi

  release:
    name: Create GitHub Release
    needs: windows_build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: app-build
          path: dist

      - name: Show files (debug)
        run: ls -R dist || true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: Get project version
        run: echo "RELEASE_VER=$(./gradlew -q printVersion)" >> $GITHUB_ENV

      - name: Check if release tag already exists
        id: check_release
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const core = require('@actions/core');
            const tag = `v${process.env.RELEASE_VER}`;
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag
              });
              core.info(`Release ${tag} already exists.`);
              core.setOutput('exists', 'true');
            } catch (e) {
              if (e.status === 404) {
                core.info(`${tag} not found — proceeding to create release.`);
                core.setOutput('exists', 'false');
              } else {
                throw e;
              }
            }

      - name: Create Release + Upload EXE/MSI
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_VER }}
          name: Release v${{ env.RELEASE_VER }}
          body: |
            ✅ Build automatique
            Commit : ${{ github.event.workflow_run.head_sha }}
          files: |
            dist/**/*.exe
            dist/**/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip release if exists
        if: steps.check_release.outputs.exists == 'true'
        run: |
          echo "Release v${{ env.RELEASE_VER }} already exists — skipping release creation."