name: Release & Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  ci:
    name: CI (detekt + tests + coverage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Verify (detekt + build + tests + coverage)
        run: ./gradlew verify --no-daemon --stacktrace

  semantic_release:
    name: semantic-release
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release_check.outputs.released }}
      tag: ${{ steps.release_check.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm install

      - name: Capture latest tag before release
        id: before
        run: echo "tag=$(git tag --sort=-version:refname | head -1)" >> $GITHUB_OUTPUT

      - name: Run semantic-release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect new release
        id: release_check
        run: |
          git fetch --tags
          LATEST=$(git tag --sort=-version:refname | head -1)
          BEFORE="${{ steps.before.outputs.tag }}"
          if [ -n "$LATEST" ] && [ "$LATEST" != "$BEFORE" ]; then
            echo "released=true" >> $GITHUB_OUTPUT
            echo "tag=$LATEST" >> $GITHUB_OUTPUT
          else
            echo "released=false" >> $GITHUB_OUTPUT
          fi

  windows_build:
    name: Build and publish Windows binaries
    needs: semantic_release
    if: ${{ needs.semantic_release.outputs.released == 'true' }}
    runs-on: windows-latest
    steps:
      - name: Checkout at release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.semantic_release.outputs.tag }}

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build EXE and MSI
        run: .\gradlew.bat packageDistributionForCurrentOS --no-daemon --stacktrace

      # Empreinte SHA-256 publiée à côté de chaque installeur (asset "<installeur>.sha256",
      # format "<digest>  <nom>"). Le client la télécharge et la compare avant de lancer le
      # binaire : sans cet asset, l'auto-update refuse l'installation (vérification d'intégrité).
      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Path build/compose/binaries -Include *.exe,*.msi |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$hash  $($_.Name)" | Set-Content -NoNewline -Path "$($_.FullName).sha256"
            }

      - name: Attach binaries to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.semantic_release.outputs.tag }}
          files: |
            build/compose/binaries/**/exe/*.exe
            build/compose/binaries/**/exe/*.exe.sha256
            build/compose/binaries/**/msi/*.msi
            build/compose/binaries/**/msi/*.msi.sha256

  android_build:
    name: Build and publish Android APK
    needs: semantic_release
    if: ${{ needs.semantic_release.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout at release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.semantic_release.outputs.tag }}

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # L'APK sort dans build/outputs/apk/debug/ejdr-frontend-debug.apk (confirmé localement).
      # On le copie sous un nom versionné et clair pour l'asset de release.
      - name: Rename APK with version
        run: |
          APK=$(find build -path '*/apk/debug/*.apk' | head -1)
          if [ -z "$APK" ]; then echo "APK debug introuvable"; exit 1; fi
          cp "$APK" "E-JDR-${{ needs.semantic_release.outputs.tag }}.apk"

      - name: Attach APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.semantic_release.outputs.tag }}
          files: E-JDR-${{ needs.semantic_release.outputs.tag }}.apk
